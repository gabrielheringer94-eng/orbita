- "vocab": 10 a 14 palavras ou expressões úteis do tema, cada uma com "en", "pt" (tradução em português do Brasil) e "ex" (frase de exemplo curta e natural em inglês).
- "phrases": 5 frases prontas para usar em conversa, com "en" e "pt".
- "grammar_pt": 2 a 4 dicas curtas em português sobre preposições, collocations ou armadilhas do tema para brasileiros, citando o inglês.
- "questions": 4 perguntas de speaking em inglês sobre o tema.
- "quiz": 6 exercícios de completar, "q" frase em inglês com ___, "o" 3 opções, "a" índice da certa (varie a posição), "why" explicação curta em português.
Nenhum campo pode ter travessões. Ortografia britânica.
Responda só com JSON:
{"title":"...","summary_pt":"...","vocab":[{"en":"...","pt":"...","ex":"..."}],"phrases":[{"en":"...","pt":"..."}],"grammar_pt":["..."],"questions":["..."],"quiz":[{"q":"...","o":["...","...","..."],"a":0,"why":"..."}]}`, {cache:false});
    if(!r || typeof r.title!=="string" || !Array.isArray(r.vocab) || !r.vocab.length) throw {code:"invalid_json"};
    const S = x => String(x ?? "");
    const doc = {date, unit:UNIT.n, topic, title:S(r.title), summary_pt:S(r.summary_pt),
      vocab:r.vocab.slice(0,16).map(v => ({en:S(v.en), pt:S(v.pt), ex:S(v.ex)})),
      phrases:(r.phrases||[]).slice(0,6).map(v => ({en:S(v.en), pt:S(v.pt)})),
      grammar_pt:(r.grammar_pt||[]).slice(0,4).map(S), questions:(r.questions||[]).slice(0,5).map(S),
      quiz:(r.quiz||[]).filter(q => q && Array.isArray(q.o) && q.o.length>=2 && Number.isInteger(q.a) && q.a < q.o.length).slice(0,8).map(q => ({q:S(q.q), o:q.o.map(S), a:q.a, why:S(q.why)})),
      answers:{}, created:Date.now()};
    const id = "c-" + date + "-" + Date.now().toString(36);
    await acol.doc(id).set(doc);
    clsAdd = false; clsTopic = ""; clsDate = ""; clsView = id;
  }catch(e){
    clsErr = ({rate_limited:"Too many requests in a row. Try again in a minute.", invalid_json:"The study sheet came back incomplete. Try again."})[e?.code] || "Couldn't create the study sheet right now. Try again.";
  }finally{ clsBusy = false; render(); }
}
function goTab(t){
  const b = document.querySelector(`nav.tabs [data-tab="${t}"]`); if(b) b.click();
  document.querySelector("nav.tabs")?.scrollIntoView({block:"start", behavior:"smooth"});
}
$("#panel").addEventListener("input", e => { if(e.target.id==="clsTopic") clsTopic = e.target.value; if(e.target.id==="clsDate") clsDate = e.target.value; });
$("#panel").addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b) return; const ds = b.dataset;
  if(ds.hgo){
    if(ds.hgo==="class"){ clsView = ds.hcid || null; if(ds.hadd){ clsAdd = true; clsView = null; } goTab("class"); }
    else { if(ds.hlesson) spLesson = ds.hlesson; if(ds.hgo==="tobe") bView = openB() ? "q" : "home"; goTab(ds.hgo); }
  }
  else if(ds.hcls){ clsView = ds.hcls; goTab("class"); }
  else if(ds.cview !== undefined){ clsView = ds.cview || null; confirmDel = null; render(); window.scrollTo({top: document.querySelector("nav.tabs").offsetTop - 8}); }
  else if(ds.cadd){ clsAdd = ds.cadd==="1"; clsErr = ""; render(); if(clsAdd) setTimeout(() => $("#clsTopic")?.focus(), 0); }
  else if(ds.csave) clsCreate();
  else if(ds.cq){
    const [id,i,j] = ds.cq.split(":"); const c = aDocs.find(x => x.id===id); if(!c || (c.answers||{})[i]) return;
    const a = {pick:+j, ok:+j===c.quiz[+i].a}; c.answers = {...(c.answers||{}), [i]:a}; render();
    try{ await acol.doc(id).update({answers:{[i]:a}}); }catch(err){ status("Couldn't save this answer.", true); }
  }
  else if(ds.cdel){
    if(confirmDel!==ds.cdel){ confirmDel = ds.cdel; render(); return; }
    confirmDel = null; clsView = null;
    try{ await acol.doc(ds.cdel).delete(); }catch(err){ status("Couldn't delete.", true); }
    render();
  }
});


/* ===== Ask: questions answered on the spot by the AI (streaming) ===== */
let qcol = null, qConvs = [], qCur = null, qMsgs = [], qInput = "", qBusy = false, qErr = "", qCtl = null, qHist = false;
const Q_CHIPS = ["Qual a diferença entre make e do?","Quando uso in, on ou at?","Como digo \"estou com saudade\"?","When do I use present perfect?","Is \"I'm agree\" correct?","Como pedir a conta num restaurante?"];
function askPreamble(){
  const c = (typeof allClasses === "function" ? allClasses()[0] : null);
  return `Você é o professor de inglês particular de um brasileiro (nível ${curLevel()}, fazendo intercâmbio em Malta, inglês britânico). Ele entende bem ouvindo e lendo, mas trava para montar frases. Responda as dúvidas dele de forma RÁPIDA e DIRETA:
- Responda em português do Brasil, com os exemplos em inglês.
- Comece direto pela resposta, sem introdução e sem repetir a pergunta.
- No máximo umas 120 palavras, a não ser que ele peça mais detalhes.
- Dê 2 ou 3 exemplos curtos e naturais, um por linha começando com "- ".
- Se for "como eu digo X", dê primeiro a forma natural britânica e, se ajudar, uma alternativa mais informal.
- Se ele escrever em inglês, no final corrija a frase dele em uma linha: "Sua frase corrigida: ...".
- Destaque a estrutura principal com **negrito**. Não use títulos, tabelas nem travessões.
Contexto: unidade atual do livro Unit ${UNIT.n} ${UNIT.title}${c?`; aula mais recente: ${c.title}`:""}.`;
}
function mdLite(t){
  t = String(t).replace(/^\s*#{1,6}\s*(.+)$/gm, "**$1**").replace(/^\s*[-*_]{3,}\s*$/gm, "");
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split(/\n/).map(l => /^\s*[-•]\s+/.test(l) ? `<li>${l.replace(/^\s*[-•]\s+/, "")}</li>` : l.trim() ? `<p>${l}</p>` : "").join("").replace(/(<li>.*?<\/li>)+/g, m => `<ul>${m}</ul>`);
}
async function askSend(text){
  text = String(text || "").trim();
  if(!text || qBusy || !sample) return;
  qErr = ""; qInput = "";
  const userMsg = {r:"user", t:text, ts:Date.now()};
  if(qAttach){ userMsg.ctx = qAttach; qAttach = ""; }
  qMsgs = qMsgs.concat([userMsg]);
  const ai = {r:"assistant", t:"", ts:Date.now(), pending:true};
  qMsgs.push(ai); qBusy = true; render(); askScroll();
  const hist = qMsgs.filter(m => !m.pending && !m.err).slice(-10);
  const withCtx = m => m.ctx ? `Exercício que estou fazendo agora no app:\n"""${m.ctx}"""\n\nMinha dúvida: ${m.t}` : m.t;
  const messages = hist.map((m,i) => ({role:m.r, content: i===0 && m.r==="user" ? askPreamble() + "\n\nPergunta: " + withCtx(m) : m.r==="user" ? withCtx(m) : m.t}));
  if(messages[0].role !== "user") messages.shift();
  if(!messages[0].content.startsWith("Você é")) messages[0].content = askPreamble() + "\n\nPergunta: " + messages[0].content;
  const t0 = performance.now(); let first = null;
  qCtl = new AbortController();
  try{
    const r = await sample(messages, {modelTier:"quick", signal:qCtl.signal, cache:false, onText: ({text}) => {
      if(first === null) first = performance.now() - t0;
      ai.t = text; askPaint(ai);
    }});
    ai.t = (r && typeof r.text === "string" && r.text) || ai.t;
    if(first === null) first = performance.now() - t0;
    ai.first = Math.round(first); ai.total = Math.round(performance.now() - t0);
    delete ai.pending;
    if(!ai.t.trim()){ ai.err = true; ai.t = "The answer came back empty. Try again."; }
  }catch(e){
    delete ai.pending; ai.err = true;
    ai.t = e?.code==="rate_limited" ? "Too many questions in a row. Wait a moment and ask again." : e?.code==="cancelled" || e?.name==="AbortError" ? (ai.t || "Stopped.") : e?.code==="not_granted" ? (e.message || "Allow the AI to answer questions.") : (e?.message && e.message.length < 140 ? e.message : "Couldn't answer right now. Try again.");
  }finally{
    qBusy = false; qCtl = null; render(); askScroll();
    await askSave();
  }
}
async function askSave(){
  if(!qcol) return;
  const msgs = qMsgs.filter(m => !m.pending).map(m => { const o = {r:m.r, t:m.t, ts:m.ts}; if(m.ctx) o.ctx = m.ctx; if(m.err) o.err = true; if(m.first) o.first = m.first; if(m.total) o.total = m.total; return o; });
  if(!msgs.length) return;
  if(!qCur) qCur = "q-" + Date.now();
  try{ await qcol.doc(qCur).set({started: msgs[0].ts, updated: Date.now(), title: msgs[0].t.slice(0,90), msgs}); }catch(e){}
}
function askPaint(ai){
  document.querySelectorAll(".msg.ai.live .msg-body").forEach(el => { el.innerHTML = mdLite(ai.t) || `<span class="typing"><i></i><i></i><i></i></span>`; });
  askScroll();
}
function askScroll(){
  document.querySelectorAll(".chat").forEach(l => {
    if(l.classList.contains("sheet-chat")){ l.scrollTop = l.scrollHeight; return; }
    if(l.offsetParent){ const last = l.lastElementChild; if(last) last.scrollIntoView({block:"end", behavior:"smooth"}); }
  });
}
const askEx = t => t.split("\n").filter(l => /^\s*[-•]\s+/.test(l)).map(l => l.replace(/^\s*[-•]\s+/, "").replace(/\*\*/g, "").replace(/\s*\(.*?\)\s*$/, "")).join(". ");
function askMsgHTML(m){
  if(m.r === "user") return `<div class="msg me">${m.ctx?`<div class="msg-ctx">📎 ${esc(m.ctx.slice(0,70))}${m.ctx.length>70?"...":""}</div>`:""}<div class="msg-body">${esc(m.t)}</div></div>`;
  const live = m.pending;
  return `<div class="msg ai${live?" live":""}${m.err?" err":""}"><div class="msg-tag">💬 Teacher</div><div class="msg-body">${m.t ? mdLite(m.t) : `<span class="typing"><i></i><i></i><i></i></span>`}</div>
    ${!live && !m.err ? `<div class="msg-meta">${m.first?`answered in ${(m.first/1000).toFixed(1)}s`:""}${canSpeak && askEx(m.t)?` <button class="ghost mini" type="button" data-qsay="${esc(askEx(m.t))}">Listen to examples</button>`:""}</div>` : ""}</div>`;
}
let qWarm = 0;
function renderAsk(p){
  if(sample && typeof sample.warm === "function" && Date.now() - qWarm > 120000){ qWarm = Date.now(); try{ sample.warm(); }catch(e){} }
  const f = document.activeElement?.id === "qIn", pos = f ? document.activeElement.selectionStart : 0;
  let h = `${attachHTML()}<div class="env env-ask"><div class="env-tag">💬 Ask the teacher</div>
    <div class="env-title">Any doubt, answered on the spot</div>
    <div class="meta">Pergunte em português ou inglês: gramática, vocabulário, "como eu digo...", dúvidas da aula.</div></div>`;
  if(!qMsgs.length){
    h += `<div class="chips qchips">${Q_CHIPS.map(c => `<button class="chip" type="button" data-qchip="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
  }
  h += `<div class="chat">${qMsgs.map(askMsgHTML).join("")}</div>`;
  h += `<div class="ask-box"><textarea id="qIn" rows="2" placeholder="Type your question..." aria-label="Your question">${esc(qInput)}</textarea>
    ${qBusy ? `<button class="ghost" type="button" data-qstop="1">Stop</button>` : `<button class="go" type="button" data-qsend="1" ${sample?"":"disabled"}>Ask</button>`}</div>
    ${qErr?`<div class="status err">${esc(qErr)}</div>`:""}
    <div class="actions">${qMsgs.length?`<button class="ghost" type="button" data-qnew="1">New conversation</button>`:""}
    ${qConvs.length?`<button class="ghost" type="button" data-qhist="1">${qHist?"Hide history":`History (${qConvs.length})`}</button>`:""}</div>`;
  if(qHist && qConvs.length) h += `<ul class="hist">${qConvs.slice(0,20).map(c => `<li><button type="button" data-qopen="${c.id}"><span>${esc(c.title||"")}</span><span class="meta">${new Date(c.started).toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}</span><span></span></button></li>`).join("")}</ul>`;
  p.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">${h}</div>`;
  if(f){ const n = $("#qIn"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }
}
$("#panel").addEventListener("input", e => { if(e.target.id==="qIn") qInput = e.target.value; });
$("#panel").addEventListener("keydown", e => { if(e.target.id==="qIn" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); askSend(qInput); } });
$("#panel").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return; const ds = b.dataset;
  if(ds.qsend) askSend(qInput);
  else if(ds.qchip) askSend(ds.qchip);
  else if(ds.qstop) qCtl?.abort();
  else if(ds.qnew){ qCtl?.abort(); qMsgs = []; qCur = null; qInput = ""; render(); setTimeout(() => $("#qIn")?.focus(), 0); }
  else if(ds.qhist){ qHist = !qHist; render(); }
  else if(ds.qopen){ const c = qConvs.find(x => x.id===ds.qopen); if(c){ qCur = c.id; qMsgs = (c.msgs||[]).map(m => ({...m})); qHist = false; render(); askScroll(); } }
  else if(ds.qsay) speak(ds.qsay);
  else if(ds.qdetach){ qAttach = ""; render(); }
});


/* ===== Ask anywhere: floating button, chat sheet and "ask about this exercise" ===== */
let qSheet = false, qAttach = "";
(function(){
  const fab = document.createElement("button");
  fab.id = "askFab"; fab.type = "button"; fab.innerHTML = "💬 Ask"; fab.setAttribute("aria-label", "Ask the teacher");
  const sh = document.createElement("div"); sh.id = "askSheet"; sh.hidden = true;
  document.body.appendChild(fab); document.body.appendChild(sh);
  fab.addEventListener("click", () => openSheet(""));
})();
function openSheet(ctxText){
  if(ctxText) qAttach = ctxText;
  if(tab === "ask"){ render(); setTimeout(() => $("#qIn")?.focus(), 0); return; }
  qSheet = true; renderSheet(); setTimeout(() => $("#qIn2")?.focus(), 50);
}
function closeSheet(){ qSheet = false; renderSheet(); }
function attachHTML(){
  return qAttach ? `<div class="q-attach"><span>📎 About: ${esc(qAttach.slice(0,80))}${qAttach.length>80?"...":""}</span><button type="button" class="iconbtn" data-qdetach="1" aria-label="Remove">✕</button></div>` : "";
}
function renderSheet(){
  const sh = $("#askSheet"), fab = $("#askFab"); if(!sh) return;
  fab.hidden = qSheet || tab === "ask";
  sh.hidden = !qSheet; document.body.classList.toggle("sheet-open", qSheet);
  if(!qSheet){ sh.innerHTML = ""; return; }
  const f = document.activeElement?.id === "qIn2", pos = f ? document.activeElement.selectionStart : 0;
  sh.innerHTML = `<div class="sheet-bg" data-qclose="1"></div><div class="sheet" role="dialog" aria-label="Ask the teacher">
    <div class="sheet-head"><b>💬 Ask the teacher</b><span class="sheet-acts">${qMsgs.length?`<button class="ghost mini" type="button" data-qnew="1">New</button>`:""}<button class="iconbtn" type="button" data-qclose="1" aria-label="Close">✕</button></span></div>
    <div class="chat sheet-chat">${qMsgs.length ? qMsgs.map(askMsgHTML).join("") : `<div class="meta">Pergunte qualquer dúvida, em português ou inglês. A resposta chega na hora.</div><div class="chips qchips">${Q_CHIPS.slice(0,4).map(c => `<button class="chip" type="button" data-qchip="${esc(c)}">${esc(c)}</button>`).join("")}</div>`}</div>
    ${attachHTML()}
    <div class="ask-box"><textarea id="qIn2" rows="2" placeholder="${qAttach?"What's your doubt about this exercise?":"Type your question..."}" aria-label="Your question">${esc(qInput)}</textarea>
    ${qBusy ? `<button class="ghost" type="button" data-qstop="1">Stop</button>` : `<button class="go" type="button" data-qsend="1" ${sample?"":"disabled"}>Ask</button>`}</div></div>`;
  const c = sh.querySelector(".sheet-chat"); if(c) c.scrollTop = c.scrollHeight;
  if(f){ const n = $("#qIn2"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }
}
function decorateAsk(){
  const p = $("#panel"); if(!p) return;
  p.querySelectorAll(".exr, .card, .rwcard").forEach(el => {
    if(el.querySelector(":scope > .ask-this")) return;
    const b = document.createElement("button"); b.type = "button"; b.className = "ask-this"; b.dataset.askthis = "1";
    b.setAttribute("aria-label", "Ask about this exercise"); b.textContent = "💬";
    el.appendChild(b);
  });
  const fab = $("#askFab"); if(fab) fab.hidden = qSheet || tab === "ask";
}
function cardText(el){
  const c = el.cloneNode(true); c.querySelectorAll(".ask-this, textarea, .actions, .bank").forEach(x => x.remove());
  return (c.innerText || c.textContent || "").replace(/[ \t]+/g," ").replace(/\n\s*\n+/g,"\n").trim().slice(0,700);
}
document.addEventListener("click", e => {
  const b = e.target.closest("button, .sheet-bg"); if(!b) return;
  const ds = b.dataset;
  if(ds.askthis){ e.stopPropagation(); const card = b.parentElement; openSheet(cardText(card)); return; }
  if(!b.closest("#askSheet")) return;
  if(ds.qclose) closeSheet();
  else if(ds.qdetach){ qAttach = ""; renderSheet(); }
  else if(ds.qsend) askSend(qInput);
  else if(ds.qchip) askSend(ds.qchip);
  else if(ds.qstop) qCtl?.abort();
  else if(ds.qnew){ qCtl?.abort(); qMsgs = []; qCur = null; qInput = ""; qAttach = ""; renderSheet(); setTimeout(() => $("#qIn2")?.focus(), 0); }
  else if(ds.qsay) speak(ds.qsay);
}, true);
document.addEventListener("input", e => { if(e.target.id === "qIn2") qInput = e.target.value; });
document.addEventListener("keydown", e => {
  if(e.target.id === "qIn2" && e.key === "Enter" && !e.shiftKey){ e.preventDefault(); askSend(qInput); }
  if(e.key === "Escape" && qSheet) closeSheet();
});

render();
</script>
