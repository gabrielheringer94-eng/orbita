<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CTX = ["General","Restaurant","Class","Transport","Shopping","Work","Social"];
const CTXMAP = {Geral:"General",Restaurante:"Restaurant",Aula:"Class",Transporte:"Transport",Compras:"Shopping",Trabalho:"Work",Treino:"Practice"};
const ctxL = c => CTXMAP[c] || c || "General";
let mode = "tr";
const PH = {tr:"Type in Portuguese or English: a word, a sentence, something you heard...", fix:"Write what you want to say in English, your way. You get the natural version and a short explanation."};
$("#mode").addEventListener("click", e => { const b = e.target.closest(".chip"); if(!b) return;
  mode = b.dataset.m; document.querySelectorAll("#mode .chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.m===mode));
  $("#txt").placeholder = PH[mode]; $("#go").textContent = mode==="fix" ? "Fix it" : "Translate"; $("#txt").focus(); });
let ctx = "General", sample = null, col = null, items = [], tab = "home", busy = false, ctl = null;
let tcol = null, days = [], genBusy = false, treErr = "";
const drafts = {}, picks = {}, checking = new Set(), retry = new Set(), tipOpen = new Set(), exErr = {};
let open = null, confirmDel = null, query = "", onlyFav = false, card = null, shown = false;
let dbState = "loading"; // loading | ok | off

/* contexto */
$("#ctx").innerHTML = CTX.map(c => `<button class="chip" type="button" aria-pressed="${c===ctx}" data-c="${c}">${c}</button>`).join("");
$("#ctx").addEventListener("click", e => { const b = e.target.closest(".chip"); if(!b) return;
  ctx = b.dataset.c; document.querySelectorAll("#ctx .chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.c===ctx)); });

function status(msg, err){ const s=$("#status"); s.textContent = msg||""; s.className = "status"+(err?" err":""); }

/* voz */
const canSpeak = "speechSynthesis" in window;
function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="en-GB"; u.rate=.9; speechSynthesis.speak(u);}catch(e){} }
async function copy(t, btn){ try{ await navigator.clipboard.writeText(t); btn.textContent="Copied"; setTimeout(()=>btn.textContent="Copy",1200);}catch(e){ btn.textContent="Couldn't copy"; } }

const norm = s => s.toLowerCase().replace(/\s+/g," ").trim();
function idFor(s){ let h=5381; for(const ch of norm(s)) h=((h<<5)+h+ch.codePointAt(0))>>>0; return "f"+h.toString(36); }
const enOf = r => r.kind==="fix" ? r.out : (r.from==="en" ? r.src : r.out);
const ptOf = r => r.meaningPt || (r.from==="pt" ? r.src : r.out);

/* runtime */
(async () => {
  if(!window.claude){ status("Abra pelo Órbita (aba Inglês) para traduzir e salvar.", true); dbState="off"; render(); return; }
  const [s, db] = await Promise.all([claude.use("sample"), claude.use("db")]);
  sample = s;
  if(!sample){ $("#go").disabled = true; status("Translation isn't available in this view.", true); }
  if(db){
    col = db.collection("frases");
    col.orderBy("ts","desc").limit(1000).onSnapshot(snap => {
      items = snap.docs.map(d => ({id:d.id, ...d.data()})); dbState="ok"; render();
    }, () => { dbState="off"; render(); });
    tecol = db.collection("testes");
    tecol.orderBy("date","desc").limit(60).onSnapshot(snap => {
      tests = snap.docs.map(d => ({id:d.id, ...d.data()})); render();
    }, () => {});
    rcol = db.collection("leituras");
    rcol.orderBy("day","asc").limit(40).onSnapshot(snap => {
      reads = snap.docs.map(d => ({id:d.id, ...d.data()})); render();
    }, () => {});
    qcol = db.collection("duvidas");
    qcol.orderBy("updated","desc").limit(30).onSnapshot(snap => { qConvs = snap.docs.map(d => ({id:d.id, ...d.data()})); if(tab==="ask" && !qBusy) render(); }, () => {});
    acol = db.collection("aulas");
    acol.onSnapshot(snap => { aDocs = snap.docs.map(d => ({id:d.id, ...d.data()})).filter(c => c.date && c.title); render(); }, () => {});
    spcol = db.collection("fala");
    spcol.onSnapshot(snap => {
      const o = {}; snap.docs.forEach(d => { o[d.id] = {...d.data(), _saved:true}; }); spDocs = o; render();
    }, () => {});
    bcol = db.collection("dominio");
    bcol.orderBy("started","desc").limit(60).onSnapshot(snap => {
      bSess = snap.docs.map(d => ({id:d.id, ...d.data()})); render();
    }, () => {});
    tcol = db.collection("treinos");
    tcol.doc(UNIT.id).onSnapshot(snap => { uDoc = snap.exists ? {...snap.data(), _saved:true} : null; render(); }, () => {});
    tcol.orderBy("date","desc").limit(90).onSnapshot(snap => {
      days = snap.docs.map(d => ({id:d.id, ...d.data()})); render();
    }, () => {});
  } else { dbState="off"; render(); }
})();

function prompt(text){
  if(mode==="fix") return `Você é o professor de inglês de bolso de um brasileiro com nível B1 que está passando uma temporada em Malta (inglês britânico). Ele entende bem ouvindo e lendo, mas trava para MONTAR frases. Ele escreveu do jeito dele o que quer dizer e você devolve a versão que um nativo falaria.

Situação atual: ${ctx}.
Tentativa dele: """${text}"""

Regras:
- "translation": a frase corrigida e natural em inglês, mantendo a intenção dele. Se já estiver boa, devolva igual e diga isso na nota.
- "note": em INGLÊS simples (nível B1, frases curtas), no máximo 2 frases, explique o principal erro (ordem das palavras, tempo verbal, preposição, palavra errada), para ele não repetir. Sem travessões.
- "pattern": a estrutura reutilizável por trás da frase, com lacunas, ex.: "Could I ___, please?" ou "I've been ___ing for ___". Vazio se não houver.
- "alternatives": até 2 jeitos de dizer (um mais casual, um mais formal).
- "pronunciation": como pronunciar a frase corrigida, escrita com sons do português, sílaba tônica em MAIÚSCULAS.
- "meaning_pt": o que ele quis dizer, em português do Brasil.
- "example": outra frase curta usando o mesmo padrão; "example_pt": a tradução dela.

Responda só com JSON:
{"from":"en","to":"en","translation":"...","alternatives":["..."],"pronunciation":"...","note":"...","pattern":"...","meaning_pt":"...","example":"...","example_pt":"..."}`;
  return `Você é o tradutor de bolso de um brasileiro com inglês nível B1 que está passando uma temporada em Malta (onde se fala inglês britânico). Ele usa você no meio de situações reais, então seja rápido, natural e prático.

Situação atual: ${ctx}.
Texto recebido: """${text}"""

Regras:
- Se o texto estiver em português, traduza para o inglês que um nativo realmente falaria nessa situação (ortografia britânica, registro adequado ao contexto).
- Se estiver em inglês (ou outra língua), traduza para português do Brasil natural.
- Palavra solta: dê a tradução mais comum e, em "alternatives", até 3 outras com sentido ou uso diferente. Frase: em "alternatives", até 2 formas de dizer a mesma coisa (mais formal ou mais casual).
- "pronunciation": como pronunciar o lado em INGLÊS (original ou tradução), escrito com sons do português para um brasileiro ler em voz alta, sílaba tônica em MAIÚSCULAS. Ex.: "kud ai HAV dhi BIL, pliz".
- "note": uma dica curta em INGLÊS simples (nível B1, máx. 2 frases) sobre uso, falso cognato, gíria ou armadilha comum. Sem travessões.
- "pattern": se for frase, a estrutura em inglês reutilizável com lacunas para ele montar outras frases parecidas (ex.: "Could I have ___, please?"). Vazio para palavra solta.
- "meaning_pt": o sentido em português do Brasil (se o original já é português, repita).
- "example": uma frase curta em inglês usando a expressão nessa situação; "example_pt": a tradução dela.

Responda só com JSON:
{"from":"pt"|"en"|"outro","to":"en"|"pt","translation":"...","alternatives":["..."],"pronunciation":"...","note":"...","pattern":"...","meaning_pt":"...","example":"...","example_pt":"..."}`;
}

async function translate(auto){
  const text = $("#txt").value.trim();
  if(!text || busy || !sample) return;
  if(auto !== true){ clearTimeout(liveT); clearTimeout(fullT); liveCtl?.abort(); }
  busy = true; $("#go").disabled = true; if(auto !== true) status(mode==="fix" ? "Checking..." : "Translating...");
  ctl = new AbortController();
  try{
    const r = await sample.json(prompt(text), {modelTier:"quick", signal: ctl.signal});
    if(!r || typeof r.translation !== "string") throw {code:"invalid_json"};
    if($("#txt").value.trim() !== text) return;
    const id = (mode==="fix"?"x":"") + idFor(text), prev = items.find(i => i.id===id);
    const rec = { src:text, out:r.translation, from: mode==="fix" ? "en" : (r.from==="pt"?"pt":"en"), kind: mode,
      pattern: String(r.pattern||""), meaningPt: String(r.meaning_pt||""),
      alts: Array.isArray(r.alternatives)? r.alternatives.slice(0,4).map(String):[],

let liveT = null, fullT = null, liveCtl = null, liveSeq = 0, lastAuto = null;

Texto: """${t}"""`;

function paintLive(text, raw, done){
  if($("#txt").value.trim() !== text) return;
  if(current && current.src === text) return;
  const m = /^\s*(EN|PT)\s*:\s*/i.exec(raw||""), lang = m ? (m[1].toUpperCase()==="EN" ? "English" : "Portuguese") : "";
  const out = m ? raw.slice(m[0].length).replace(/^["“]|["”]$/g,"") : "";
  const box = $("#resultBox"); box.hidden = false;
  box.innerHTML = `<div class="result live-tr"><div class="lang">${lang ? esc(lang) + " · " : ""}live${done ? "" : " ..."}</div>
    <p class="big">${out ? esc(out) : `<span class="typing"><i></i><i></i><i></i></span>`}</p>
    <div class="meta">${done ? "Pronunciation and tips in a moment..." : "Translating as you type"}</div></div>`;
}
async function liveTranslate(text){
  if(mode !== "tr" || !sample || typeof sample !== "function") return;
  if($("#txt").value.trim() !== text) return;
  const seq = ++liveSeq; liveCtl?.abort();
  if(liveCache.has(text)){ paintLive(text, liveCache.get(text), true); return; }
  const c = liveCtl = new AbortController();
  paintLive(text, "", false);
  try{
    const r = await sample(livePrompt(text), {modelTier:"quick", maxTokens:220, signal:c.signal, cache:false, onText: ({text:t}) => { if(seq === liveSeq) paintLive(text, t, false); }});
    if(seq !== liveSeq) return;
    const raw = (r && r.text) || "";
    if(raw){ liveCache.set(text, raw); if(liveCache.size > 200) liveCache.delete(liveCache.keys().next().value); }
    paintLive(text, raw, true);
  }catch(e){ /* nova digitação cancelou ou falhou: a tradução completa vem logo depois */ }
}

const CEFR = [
  {lvl:"A1", name:"Beginner", gse:[22,29], can:"Understands very basic everyday expressions and simple sentences."},
  {lvl:"A2", name:"Basic", gse:[30,42], can:"Understands isolated sentences and frequent expressions about routines and simple tasks."},
  {lvl:"B1", name:"Intermediate", gse:[43,58], can:"Handles most travel situations and understands familiar topics at work or in free time."},
  {lvl:"B2", name:"Independent user", gse:[59,75], can:"Communicates fluently and naturally with native speakers, without visible effort, even with complex texts."},
  {lvl:"C1", name:"Effective proficiency", gse:[76,84], can:"Expresses himself fluently and spontaneously in demanding academic and professional contexts."},
];
const cefr = l => CEFR.find(c => c.lvl === String(l||"").replace("+","")) || null;
const lvlFromGse = g => (CEFR.slice().reverse().find(c => g >= c.gse[0]) || CEFR[0]).lvl;
function curLevel(){
  const d = doneTests();
  const last = d[d.length-1];
  return last ? String(last.level).replace("+","") : "B1";
}

  return `<div class="lvh"><span class="lvtag">${c.lvl}</span><div><div class="ttl">${c.name} <span class="gse">· GSE ${c.gse[0]} to ${c.gse[1]}</span></div><div class="note">${esc(c.can)}</div></div></div>`;
}

/* ===== Treino diário ===== */
const ymd = d => d.toLocaleDateString("sv-SE");
const complete = d => Array.isArray(d.items) && Object.keys(d.answers||{}).length >= d.items.length;
function streak(){
  const done = new Set(days.filter(complete).map(d => d.date));
  let n = 0; const d = new Date(); if(!done.has(ymd(d))) d.setDate(d.getDate()-1);
  while(done.has(ymd(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
const todayDoc = () => days.find(d => d.id === ymd(new Date()));
const cleanW = s => s.toLowerCase().replace(/[^a-z0-9'’\s]/g,"").replace(/’/g,"'").replace(/\s+/g," ").trim();
function seeded(arr, seed){ const a = arr.slice(); let s = seed; for(let i=a.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function wordsOf(it, i){
  const w = it.answer.split(/\s+/).filter(Boolean);
  let sh = seeded(w, i*97 + w.length*13 + 7);
  if(sh.join(" ")===w.join(" ") && w.length>1) sh = sh.slice(1).concat(sh[0]);
  return sh;
}

function levelPlan(){
  const i = Math.max(0, CEFR.findIndex(c => c.lvl === curLevel()));
  const below = CEFR[Math.max(0,i-1)].lvl, cur = CEFR[i].lvl, up = CEFR[Math.min(CEFR.length-1,i+1)].lvl;
  const plan = [];
  if(below !== cur) plan.push({lvl:below, n:1, why:"(consolidar a base)"});
  plan.push({lvl:cur, n: below===cur ? 4 : 3, why:"(nível atual, o centro do treino)"});
  if(up !== cur) plan.push({lvl:up, n:2, why:"(desafio para subir de nível)"});
  else plan[plan.length-1].n += 2;
  return plan;
}
function promptGen(recent){
  return `Crie o treino diário de inglês de um brasileiro com nível B1 que está passando 3 semanas em Malta (inglês britânico). Ele entende bem ouvindo e lendo, mas trava para MONTAR frases sozinho. Rotina dele: aula de inglês de segunda a sexta das 15h às 18h40, e no resto do tempo restaurante, transporte, compras, passeios e conversa com colegas de turma.

${recent}
${focusLine()}${unitLine()}${classLine()}${toBeLine()}

Organize o treino pelos níveis do CEFR (com equivalência GSE). Nível atual dele: ${curLevel()}.
${levelPlan().map(x => `- ${x.n} exercício(s) de nível ${x.lvl} (${cefr(x.lvl).name}, GSE ${cefr(x.lvl).gse[0]} a ${cefr(x.lvl).gse[1]}): ${cefr(x.lvl).can} ${x.why}`).join("\n")}

- "translate": "pt" é uma frase em português que ele precisaria dizer; "answer" é a versão natural em inglês.
- "pattern": "pattern" é um molde útil com ___ (ex.: "I'm looking for ___"); "pt" descreve EM INGLÊS simples a situação e a ideia que ele deve dizer usando o molde; "answer" é uma resposta modelo.
Cada exercício tem "level" (A1, A2, B1, B2 ou C1) e "tip": dica curta em INGLÊS simples (nível B1) sobre a estrutura (ordem, tempo verbal, preposição), sem travessões e sem entregar a resposta.

Responda só com JSON:
{"items":[{"level":"A2","type":"order","pt":"...","answer":"...","pattern":"","tip":"..."}]}`;

function groupByLevel(list){
  const gs = [];
  list.forEach((it,i) => { const L = it.level || ""; let g = gs.find(x => x.L===L); if(!g){ g = {L, idx:[]}; gs.push(g); } g.idx.push(i); });
  const rank = L => { const k = CEFR.findIndex(c=>c.lvl===L); return k<0 ? 99 : k; };

}

/* ===== Weekly level test ===== */
let tecol = null, tests = [], tGen = false, tErr = "", grading = false, viewId = null;
const tDrafts = {}, tPicks = {};
const AREAS = {tobe:"Verb to be", grammar:"Grammar", vocab:"Vocabulary", order:"Sentence building", writing:"Writing"};
const doneTests = () => tests.filter(t => t.status==="done").sort((a,b) => a.date < b.date ? -1 : 1);
const openTest = () => tests.find(t => t.status==="open");
const daysBetween = (a,b) => Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00"))/864e5);
function nextTestDate(){
  const d = doneTests(); if(!d.length) return null;
  const last = d[d.length-1].date, n = new Date(last+"T12:00:00"); n.setDate(n.getDate()+7);
  return ymd(n);
}
const canStart = () => !openTest() && (!nextTestDate() || ymd(new Date()) >= nextTestDate());
function focusLine(){
  const d = doneTests(); if(!d.length) return "";
  const t = d[d.length-1];
  const weak = Object.entries(t.areas||{}).sort((a,b)=>a[1]-b[1]).slice(0,2).map(([k,v])=>`${AREAS[k]} (${v}%)`).join(", ");
  return `Resultado do último teste de nível (${t.date}): nível ${t.level}${t.gse?` (GSE estimado ${t.gse})`:""}. Áreas mais fracas: ${weak}. Foco sugerido: ${t.focus||""}. Dê mais peso a essas áreas nos exercícios de hoje.`;
}

function itemPoints(it, i, t){
  const a = (t.answers||{})[i];
  if(it.kind==="mc") return a===it.answer ? 1 : 0;
  if(it.kind==="order") return typeof a==="string" && cleanW(a)===cleanW(it.answer) ? 1 : 0;
  return ((t.grades||{})[i]?.score || 0) / 2;
}
function scoreTest(t){
  const sum = {}, cnt = {}, band = {A2:[0,0], B1:[0,0], B2:[0,0]};
  let tot = 0;
  t.items.forEach((it,i) => {
    const p = itemPoints(it,i,t); tot += p;
    sum[it.area] = (sum[it.area]||0) + p; cnt[it.area] = (cnt[it.area]||0) + 1;
    if(band[it.level]){ band[it.level][0] += p; band[it.level][1]++; }
  });
  const areas = {}; for(const k in cnt) areas[k] = Math.round(sum[k]/cnt[k]*100);
  const acc = l => band[l][1] ? band[l][0]/band[l][1] : 0;
  const a2 = acc("A2"), b1 = acc("B1"), b2 = acc("B2");
  const cl = v => Math.max(0, Math.min(1, v));
  let gse;
  if(a2 < .6) gse = 22 + Math.round(cl(a2/.6)*7);
  else if(b1 < .6) gse = 30 + Math.round(cl((a2-.6)/.4*.5 + b1/.6*.5)*12);
  else if(b2 < .6) gse = 43 + Math.round(cl((b1-.6)/.4*.5 + b2/.6*.5)*15);
  else gse = 59 + Math.round(cl((b2-.6)/.4)*16);
  return {overall: Math.round(tot/t.items.length*100), areas, level: lvlFromGse(gse), gse};
}

function shuffleIdx(n, seed){ return seeded([...Array(n).keys()], seed); }
function promptTest(){
  const prev = tests.slice(0,3).flatMap(t => (t.items||[]).map(x => "- " + x.q.slice(0,70))).slice(0,40).join("\n") || "(nenhum)";
  return `Crie o teste semanal de nivelamento de inglês de um brasileiro adulto (31 anos, profissional de vendas) que está 3 semanas em Malta estudando inglês (inglês britânico). Nível estimado B1. Ele entende bem lendo e ouvindo, mas trava para montar frases, e nunca estudou de verdade o verbo "to be". O teste precisa ser comparável semana a semana, então siga exatamente esta estrutura de 18 questões, com situações reais (aula, restaurante, transporte, compras, colegas, trabalho):

- 3 de "tobe" (kind "mc"), níveis A2, B1, B1: escolha a forma certa (am/is/are, was/were, there is/are, idade e sensações com be, perguntas com inversão).
- 3 de "grammar" (kind "mc"), níveis A2, B1, B2: tempos verbais, preposições, comparativos, present perfect.
- 4 de "vocab" (kind "mc"), níveis A2, B1, B1, B2: palavra ou expressão certa no contexto.
- 4 de "order" (kind "order"), níveis A2, B1, B1, B2: "answer" é uma frase natural de 6 a 11 palavras; "q" descreve a situação em inglês simples sem usar as palavras da resposta.
- 4 de "writing" (kind "write"): 2 de tradução (níveis B1 e B2) com "pt" contendo a frase em português e "q" = "Say it in English."; 2 perguntas abertas em inglês (níveis B1 e B2) para responder com 1 ou 2 frases, com "answer" sendo uma resposta modelo.

Para "mc": "q" é a frase com ___ ou a pergunta, "options" tem 4 opções, "answer" é o ÍNDICE (0 a 3) da correta, varie a posição da correta. Tudo em inglês, exceto o campo "pt". Não repita estas questões de testes anteriores:
${prev}

Responda só com JSON:
{"items":[{"area":"tobe","kind":"mc","level":"A2","q":"...","options":["...","...","...","..."],"answer":1,"pt":""}]}`;
}
function cleanItems(raw){
  const out = [];
  (Array.isArray(raw) ? raw : []).forEach((x,i) => {
    if(!x || !AREAS[x.area] || !["A2","B1","B2"].includes(x.level)) return;
    const base = {area:x.area, kind:x.kind, level:x.level, q:String(x.q||""), pt:String(x.pt||"")};
    if(x.kind==="mc"){
      const opts = Array.isArray(x.options) ? x.options.map(String) : [], a = Number(x.answer);
      if(opts.length<3 || !(a>=0 && a<opts.length)) return;
      const order = shuffleIdx(opts.length, i*31+7);
      out.push({...base, options: order.map(k=>opts[k]), answer: order.indexOf(a)});
    } else if((x.kind==="order" || x.kind==="write") && typeof x.answer==="string" && x.answer.trim()){
      out.push({...base, answer: x.answer.trim()});
    }
  });
  return out;
}
async function genTest(){
  if(tGen || !sample || !tecol || !canStart()) return;
  tGen = true; tErr = ""; render();
  try{
    const r = await sample.json(promptTest(), {cache:false});
    const its = cleanItems(r?.items);
    if(its.length < 14) throw {code:"invalid_json"};
    const date = ymd(new Date());
    await tecol.doc("t-"+date).set({date, status:"open", items:its, answers:{}, created:Date.now()});
  }catch(e){
    tErr = ({not_granted:"Allow Claude access to create the test.", rate_limited:"Too many requests. Try again in a few minutes.", invalid_json:"The test came back incomplete. Tap to try again."})[e?.code] || "Couldn't create the test right now. Try again.";
  }finally{ tGen = false; render(); }
}

async function saveTAnswer(t, i, v){
  t.answers = {...(t.answers||{}), [i]: v};
  try{ await tecol.doc(t.id).update({answers: {[String(i)]: v}}); }catch(e){}
}
const tAnswered = (t,i) => { const it = t.items[i], a = (t.answers||{})[i];
  if(it.kind==="write") return !!(tDrafts[i] ?? a ?? "").trim();
  return a!==undefined && a!==null && a!==""; };

function promptGrade(t){
  const writes = t.items.map((it,i)=>({it,i})).filter(x=>x.it.kind==="write");
  const wrong = t.items.map((it,i)=>({it,i})).filter(x=>x.it.kind!=="write" && itemPoints(x.it,x.i,t)===0)
    .map(x => `- [${AREAS[x.it.area]}] ${x.it.q} | his answer: ${x.it.kind==="mc" ? x.it.options[t.answers[x.i]] : t.answers[x.i]} | correct: ${x.it.kind==="mc" ? x.it.options[x.it.answer] : x.it.answer}`).join("\n") || "(none)";
  return `You are grading the weekly English level test of a Brazilian adult (B1, living in Malta for 3 weeks). He understands well but struggles to build sentences.

Grade each writing answer: 2 = correct and natural, 1 = understandable but with grammar or word errors, 0 = wrong, off-task or not English. Accept any natural answer, not only the model. Ignore small typos.
${writes.map((x,k)=>`${k+1}. Task: ${x.it.q}${x.it.pt?` (Portuguese: "${x.it.pt}")`:""}\n   Model: ${x.it.answer}\n   His answer: """${tDrafts[x.i] ?? t.answers[x.i] ?? ""}"""`).join("\n")}

His wrong answers in the other sections:
${wrong}

Reply only with JSON:
{"writing":[{"score":0,"better":"his answer corrected and natural","note":"one short sentence in simple English (B1) explaining the main error, or a specific compliment"}],"summary":"2 short sentences in simple English: what he does well and the main pattern in his mistakes. No dashes.","focus":"one concrete thing to practise this week, in simple English, max 12 words"}`;
}
async function submitTest(){
  const t = openTest(); if(!t || grading || !sample) return;
  if(!t.items.every((_,i)=>tAnswered(t,i))) return;
  grading = true; tErr = ""; render();
  const finalAns = {...(t.answers||{})};
  t.items.forEach((it,i) => { if(it.kind==="write") finalAns[i] = (tDrafts[i] ?? finalAns[i] ?? "").trim(); });
  t.answers = finalAns;
  try{
    const g = await sample.json(promptGrade(t), {cache:false});
    const grades = {}; let k = 0;
    t.items.forEach((it,i) => { if(it.kind!=="write") return; const w = (g?.writing||[])[k++] || {};
      grades[i] = {score: Math.max(0, Math.min(2, Math.round(Number(w.score)||0))), better: String(w.better||it.answer), note: String(w.note||"")}; });
    const res = scoreTest({...t, grades});
    const ansObj = {}; for(const i in finalAns) ansObj[String(i)] = finalAns[i];
    await tecol.doc(t.id).update({answers: ansObj, grades, status:"done", score:res.overall, areas:res.areas, level:res.level, gse:res.gse,
      summary:String(g?.summary||""), focus:String(g?.focus||""), finished:Date.now()});
    viewId = t.id;
  }catch(e){
    tErr = e?.code==="rate_limited" ? "Too many requests. Wait a moment and tap Finish again." : "Couldn't grade the test right now. Your answers are kept. Tap Finish again.";
  }finally{ grading = false; render(); }
}

function chartSVG(list){
  const L = list.slice(-8).map(t => ({...t, v: t.gse || null})).filter(t => t.v);
  if(!L.length) return "";
  const W = 320, H = 190, padL = 30, padR = 10, top = 14, bot = 30;
  const lo = Math.max(22, Math.min(...L.map(t=>t.v)) - 10), hi = Math.min(84, Math.max(...L.map(t=>t.v)) + 10);
  const y = v => top + (hi - v)/(hi - lo)*(H - top - bot);
  const step = (W-padL-padR)/Math.max(1, L.length), x = k => padL + step*k + step/2;
  let g = "";
  CEFR.forEach(c => {
    const a = Math.max(lo, c.gse[0]), b = Math.min(hi, c.gse[1]+1); if(a >= b) return;
    g += `<line x1="${padL}" x2="${W-padR}" y1="${y(a)}" y2="${y(a)}" stroke="var(--line)" stroke-dasharray="3 3"/>
      <text x="${padL-6}" y="${(y(a)+y(b))/2+4}" font-size="11" font-weight="700" text-anchor="end" fill="var(--muted)">${c.lvl}</text>`;
  });
  const pts = L.map((t,k) => `${x(k)},${y(t.v)}`).join(" ");
  if(L.length > 1) g += `<polyline points="${pts}" fill="none" stroke="var(--sea)" stroke-width="2.5" stroke-linejoin="round"/>`;
  L.forEach((t,k) => { const last = k===L.length-1;
    g += `<circle cx="${x(k)}" cy="${y(t.v)}" r="${last?6:4.5}" fill="${last?"var(--sea)":"var(--surface)"}" stroke="var(--sea)" stroke-width="2"/>
      <text x="${x(k)}" y="${y(t.v)-11}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)">${t.v}</text>
      <text x="${x(k)}" y="${H-10}" font-size="9" text-anchor="middle" fill="var(--muted)">${new Date(t.date+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="GSE score per test with CEFR levels">${g}</svg></div>`;
}
function nextLevelHTML(t){
  const c = cefr(t.level); if(!c || !t.gse) return "";
  const k = CEFR.indexOf(c), nx = CEFR[k+1];
  const pct = Math.round((t.gse - c.gse[0]) / (c.gse[1] - c.gse[0] + 1) * 100);
  return `<div class="areas"><div class="arow"><span>Inside ${c.lvl}</span><div class="track"><i style="width:${Math.max(4,pct)}%"></i></div><b>${pct}%</b></div></div>
    <div class="meta">${nx ? `${nx.gse[0] - t.gse} GSE points to reach ${nx.lvl} (${nx.name}).` : "Top of the scale in this test."}</div>`;
}

function resultsHTML(t){
  const d = doneTests(), idx = d.findIndex(x=>x.id===t.id), prev = idx>0 ? d[idx-1] : null;

      <div class="meta">${t.score}% correct${cefr(t.level)?` · ${cefr(t.level).name}`:""}</div>
      ${delta!==null?`<div class="delta">${delta>0?"+":""}${delta} GSE points vs last test${up?` · You moved up to ${esc(t.level)}`:""}</div>`:`<div class="meta">First test. This is your baseline.</div>`}
    </div></div>
    ${nextLevelHTML(t)}
    <div class="areas">${Object.keys(AREAS).filter(k=>t.areas?.[k]!==undefined).map(k=>`<div class="arow"><span>${AREAS[k]}</span><div class="track"><i class="${t.areas[k]<60?"low":""}" style="width:${t.areas[k]}%"></i></div><b>${t.areas[k]}%</b></div>`).join("")}</div>`;
  if(t.summary || t.focus) h += `<div class="focus">${t.summary?`<div class="note">${esc(t.summary)}</div>`:""}${t.focus?`<div><span class="lang">Focus this week</span><br><b>${esc(t.focus)}</b></div>`:""}</div>`;

      return `<li class="exr"><div class="lang">${AREAS[it.area]} · ${it.level}</div>
        <div class="note">${esc(it.q)}${it.pt?`<br><b>${esc(it.pt)}</b>`:""}</div>
        <div class="mine">You: <s>${esc(mine||"")}</s></div><div class="out">${esc(right)}</div>
        ${gr?.note?`<div class="note">${esc(gr.note)}</div>`:""}</li>`; }).join("") + `</ol>`;
  } else h += `<div class="note">No mistakes this time.</div>`;
  return h;
}

function ladderHTML(t){
  const here = t ? String(t.level).replace("+","") : null, hi = CEFR.findIndex(c=>c.lvl===here);
  return `<ol class="ladder">${CEFR.map((c,k)=>`<li class="${k===hi?"here":hi>=0&&k<hi?"past":""}"><div class="lv">${c.lvl}</div><div><b>${c.name}</b> <span class="gse">· GSE ${c.gse[0]} to ${c.gse[1]}</span><div class="note">${esc(c.can)}</div>${k===hi?`<span class="you">You are here${t.gse?` · GSE ${t.gse}`:""}</span>`:""}</div></li>`).join("")}</ol>
    <div class="meta">Your GSE number is an estimate from this app's test, not an official Pearson score.</div>`;
}
function renderLevel(p){

    p.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px">

function dayPlan(d){
  const base = Math.max(0, CEFR.findIndex(c => c.lvl === curLevel()));
  const wk = Math.ceil(d/7);
  const L = CEFR[Math.min(CEFR.length-1, base + (wk>=3 ? 1 : 0))].lvl;
  const min = [10,12,14,15][wk-1];
  const words = ["170 a 210","220 a 260","260 a 300","300 a 340"][wk-1];
  return {L, min, words, wk};
}
let rcol = null, reads = [], rDay = null, rGen = false, rErr = "", rStart = 0, rTick = null;
let rPop = null, rDraft = "", rChecking = false, rWErr = "";
const rCache = {};
const rid = d => "d" + String(d).padStart(2,"0");
const rDoc = d => reads.find(x => x.id === rid(d));
const rDone = d => rDoc(d)?.status === "done";
const rNext = () => { for(let d=1; d<=28; d++) if(!rDone(d)) return d; return null; };
const rOpenable = d => rDone(d) || d === rNext() || !!rDoc(d);

function coverHTML(d, small){

}

function promptRead(d){
  const b = BOOKS[d-1], P = dayPlan(d), c = cefr(P.L);
  return `Escreva a leitura do Dia ${d} de uma trilha de 28 dias de leitura em inglês para um brasileiro adulto que está em Malta estudando inglês (inglês britânico). Nível atual dele no teste semanal: ${curLevel()}. Ele entende bem lendo, mas trava para MONTAR frases, então o texto deve mostrar estruturas que ele possa reaproveitar ao falar.

Obra do dia: "${b.t}", de ${b.a} (${b.y}), em domínio público.
Escreva uma ADAPTAÇÃO ORIGINAL, recontando com suas próprias palavras um trecho marcante da obra, em inglês nível ${c.lvl} (${c.name}, GSE ${c.gse[0]} a ${c.gse[1]}): ${c.can}
Não copie frases do texto original. Tamanho total: ${P.words} palavras, em 4 a 6 parágrafos curtos. Ortografia britânica. Inclua com naturalidade pelo menos 3 estruturas úteis na conversa do dia a dia (ex.: there is/are, verbo to be, present perfect, could/would, phrasal verbs comuns). Leitura de cerca de ${P.min} minutos somando texto e exercícios.

Regras dos campos:
- "intro": 1 a 2 frases em inglês simples situando a história (quem, onde), sem estragar o final.
- "paras": os parágrafos do texto.
- "glossary": 8 a 10 itens com as palavras ou expressões mais úteis ou difíceis do texto. "w" exatamente como aparece no texto; "pt" tradução no contexto em português do Brasil; "pron" pronúncia escrita com sons do português, sílaba tônica em MAIÚSCULAS.
- "questions": 4 perguntas em inglês (compreensão literal, vocabulário no contexto e inferência), cada uma com 3 opções curtas; "a" é o índice da certa (varie a posição); "why" é 1 frase em inglês simples explicando com base no texto.
- "write": "pt" é uma frase em português ligada à história que ele deve dizer em inglês, usando uma das estruturas do texto; "model" a versão natural em inglês; "pattern" o molde reutilizável com ___.
Nenhum campo pode ter travessões.

Responda só com JSON:
{"intro":"...","paras":["..."],"glossary":[{"w":"...","pt":"...","pron":"..."}],"questions":[{"q":"...","opts":["...","...","..."],"a":0,"why":"..."}],"write":{"pt":"...","model":"...","pattern":"..."}}`;
}

async function genRead(d){
  if(rGen || !sample || !rcol) return;
  rGen = true; rErr = ""; render();
  try{
    const r = await sample.json(promptRead(d), {cache:false});
    const paras = (Array.isArray(r?.paras) ? r.paras : []).map(String).filter(s => s.trim()).slice(0,8);
    const qs = (Array.isArray(r?.questions) ? r.questions : [])
      .filter(q => q && typeof q.q==="string" && Array.isArray(q.opts) && q.opts.length>=2 && Number.isInteger(q.a) && q.a>=0 && q.a<q.opts.length)
      .slice(0,5).map(q => ({q:q.q, opts:q.opts.slice(0,4).map(String), a:q.a, why:String(q.why||"")}));
    const gl = (Array.isArray(r?.glossary) ? r.glossary : []).filter(g => g && typeof g.w==="string" && g.w.trim())
      .slice(0,12).map(g => ({w:g.w.trim(), pt:String(g.pt||""), pron:String(g.pron||"")}));
    const w = r?.write && typeof r.write.pt==="string" ? {pt:r.write.pt, model:String(r.write.model||""), pattern:String(r.write.pattern||"")} : null;
    if(paras.length < 2 || qs.length < 2) throw {code:"invalid_json"};
    const P = dayPlan(d), b = BOOKS[d-1];
    await rcol.doc(rid(d)).set({day:d, book:b.t, author:b.a, lvl:P.L, min:P.min, intro:String(r.intro||""), paras, glossary:gl, questions:qs, write:w,
      answers:{}, wres:null, status:"open", secs:0, created:Date.now(), date:ymd(new Date())});
    openDay(d);
  }catch(e){
    rErr = ({not_granted:"Allow Claude access to create your reading.", rate_limited:"Too many requests in a row. Try again in a few minutes.", invalid_json:"The reading came back incomplete. Tap to create it again."})[e?.code] || "Couldn't create today's reading right now. Try again.";
  }finally{ rGen = false; render(); }
}

function fmtT(s){ s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }

function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function storyHTML(doc){
  const gl = (doc.glossary||[]).slice().sort((a,b) => b.w.length - a.w.length);
  const re = gl.length ? new RegExp("(" + gl.map(g => "\\b" + reEsc(g.w) + "\\b").join("|") + ")", "i") : null;
  let wi = 0;
  const wordsHTML = txt => txt.split(/(\s+)/).map(tok => {
    if(!tok.trim()) return tok;
    const m = tok.match(/^([^A-Za-zÀ-ÿ'’]*)([A-Za-zÀ-ÿ'’-]+)([^A-Za-zÀ-ÿ'’]*)$/);
    if(!m) return esc(tok);
    const id = "w" + (wi++);
    return `${esc(m[1])}<span class="w${rPop?.id===id?" sel":""}" data-rw="${esc(m[2])}" data-wid="${id}">${esc(m[2])}</span>${esc(m[3])}`;
  }).join("");
  return doc.paras.map((p, pi) => {
    let out = "";
    if(re){
      const parts = p.split(re);
      parts.forEach((part, k) => {
        if(k % 2 === 1){
          const g = gl.findIndex(x => x.w.toLowerCase() === part.toLowerCase());
          const id = "g" + pi + "-" + k;
          out += `<span class="gl${rPop?.id===id?" sel":""}" data-rg="${g}" data-wid="${id}">${esc(part)}</span>`;
        } else out += wordsHTML(part);
      });
    } else out = wordsHTML(p);
    return `<p data-p="${pi}">${out}</p>${canSpeak?`<div class="ptools"><button class="ghost" type="button" data-rsay="${pi}">Listen</button></div>`:""}`;
  }).join("");
}

function sentenceOf(doc, word){
  const all = doc.paras.join(" ");
  const s = all.split(/(?<=[.!?])\s+/).find(x => x.toLowerCase().includes(word.toLowerCase()));
  return s || "";
}
async function lookupWord(word, id){
  const doc = rDoc(rDay); if(!doc) return;
  const key = word.toLowerCase(), sent = sentenceOf(doc, word);
  rPop = {id, w:word, sent, loading:true}; render();
  if(rCache[key]){ rPop = {...rPop, ...rCache[key], loading:false}; render(); return; }
  if(!sample){ rPop = {...rPop, loading:false, err:"Translation isn't available here."}; render(); return; }
  try{
    const r = await sample.json(`Um brasileiro (inglês B1) está lendo um texto em inglês e tocou na palavra "${word}". Frase do texto: """${sent}"""
Dê o sentido NESTE contexto. Responda só com JSON:
{"pt":"tradução curta em português do Brasil","pron":"pronúncia com sons do português, sílaba tônica em MAIÚSCULAS","note":"no máximo 1 frase em inglês simples sobre uso, se útil; senão vazio. Sem travessões."}`, {modelTier:"quick"});
    const v = {pt:String(r?.pt||""), pron:String(r?.pron||""), note:String(r?.note||"")};
    rCache[key] = v;
    if(rPop?.id === id){ rPop = {...rPop, ...v, loading:false}; render(); }
  }catch(e){
    if(rPop?.id === id){ rPop = {...rPop, loading:false, err: e?.code==="rate_limited" ? "Too many lookups in a row. Wait a moment." : "Couldn't translate this word. Tap it again."}; render(); }
  }
}

      note:rPop.note||"", ex:rPop.sent||"", exPt:"", ctx:"Reading", fav:true, ts:Date.now()});
    rPop = {...rPop, saved:true}; render();
  }catch(e){ rPop = {...rPop, err:"Couldn't save this word."}; render(); }

async function answerQ(qi, k){

async function checkRWrite(){
  const doc = rDoc(rDay), w = doc?.write, text = rDraft.trim();
  if(!w || !text || !sample || rChecking) return;
  rChecking = true; rWErr = ""; render();
  try{
    const r = await sample.json(promptCheck({type:"translate", pt:w.pt, answer:w.model, pattern:w.pattern}, text), {modelTier:"quick", cache:false});
    const res = {text, ok: r?.ok===true, better:String(r?.better || w.model), note:String(r?.note||"")};

      alts:[], pron:"", note:res.note, ex:"", exPt:"", ctx:"Reading", fav:true, ts:Date.now()}); }catch(e){} }
  }catch(e){ rChecking = false; rWErr = e?.code==="rate_limited" ? "Too many checks in a row. Wait a moment." : "Couldn't check it right now. Try again."; render(); }
}
function rScore(doc){
  const qs = doc.questions||[], a = doc.answers||{};
  const right = qs.filter((q,i) => a[i] === q.a).length + (doc.wres?.ok ? 1 : 0);
  return {right, total: qs.length + (doc.write ? 1 : 0)};
}
async function finishDay(){
  const doc = rDoc(rDay); if(!doc) return;
  const secs = Math.round((doc.secs||0) + (rStart ? (Date.now()-rStart)/1000 : 0));
  const s = rScore(doc);
  try{
    await rcol.doc(doc.id).update({status:"done", secs, score: s.total ? Math.round(s.right/s.total*100) : 0, doneAt:Date.now()});
    rStart = 0; rDay = null; render(); window.scrollTo({top: $("#panel").offsetTop - 10});
  }catch(e){ rWErr = "Couldn't save your progress. Try again."; render(); }
}

function renderDay(p){

  } else {
    h += `<button class="go" type="button" id="rfinish" style="margin:4px 0 0;align-self:stretch" ${allQ&&wDone?"":"disabled"}>${allQ&&wDone?`Finish day ${rDay} · ${s.right} of ${s.total} right`:"Answer the questions to finish"}</button>`;
  }
  h += `</div>`;
  if(rPop){
    h += `<div class="pop" role="dialog" aria-label="Word meaning"><div class="pop-in"><div class="rhead"><span class="pw">${esc(rPop.w)}</span><button class="iconbtn" type="button" id="rpclose" aria-label="Close">✕</button></div>
      ${rPop.loading?`<div class="meta">Translating...</div>`:rPop.err?`<div class="status err">${esc(rPop.err)}</div>`:`
      <div class="pt2">${esc(rPop.pt)}</div>${rPop.pron?`<div><span class="pron">${esc(rPop.pron)}</span></div>`:""}${rPop.note?`<div class="note">${esc(rPop.note)}</div>`:""}

  }
  p.innerHTML = h;
  if(!dn && rStart) startTick();
}

$("#panel").addEventListener("input", e => { if(e.target.dataset.rdraft) rDraft = e.target.value; });
$("#panel").addEventListener("click", e => {
  if(tab !== "read") return;
  const sp = e.target.closest("[data-rw],[data-rg]");
  if(sp){
    const doc = rDoc(rDay); if(!doc) return;
    if(sp.dataset.rg !== undefined){ const g = doc.glossary[+sp.dataset.rg]; if(g){ rPop = {id:sp.dataset.wid, w:g.w, pt:g.pt, pron:g.pron, sent:sentenceOf(doc,g.w), saved: items.some(x=>x.id===idFor(g.w))}; render(); } }
    else lookupWord(sp.dataset.rw, sp.dataset.wid);
    return;
  }
  const b = e.target.closest("button"); if(!b) return; const ds = b.dataset;
  if(ds.rday){ openDay(+ds.rday); }
  else if(ds.rstart){ genRead(+ds.rstart); }
  else if(ds.rq){ const [i,k] = ds.rq.split(":").map(Number); answerQ(i,k); }
  else if(ds.rsay){ const doc = rDoc(rDay); if(doc) speak(doc.paras[+ds.rsay]); }
  else if(ds.rgsave){ const doc = rDoc(rDay), g = doc?.glossary[+ds.rgsave]; if(g && col && !items.some(x=>x.id===idFor(g.w))){
      col.doc(idFor(g.w)).set({src:g.w, out:g.pt, from:"en", kind:"tr", pattern:"", meaningPt:g.pt, alts:[], pron:g.pron||"", note:"", ex:sentenceOf(doc,g.w), exPt:"", ctx:"Reading", fav:true, ts:Date.now()}).catch(()=>{}); } }
  else if(b.id==="rback") closeDay();
  else if(b.id==="rcheck") checkRWrite();
  else if(b.id==="rredo"){ const doc = rDoc(rDay); if(doc){ doc.wres = null; rDraft = ""; rcol.doc(doc.id).update({wres:null}).catch(()=>{}); render(); } }
  else if(b.id==="rfinish") finishDay();
  else if(b.id==="rpclose"){ rPop = null; render(); }
  else if(b.id==="rpsay"){ if(rPop) speak(rPop.w); }
  else if(b.id==="rpsave") saveWord();
});

let uDoc = null, uOpen = false, uSec = null;
const uDrafts = {}, uPicks = {}, uChecking = new Set(), uRetry = new Set(), uErr = {}, uTip = new Set();
const unitActive = () => { const d = ymd(new Date()); return d >= UNIT.from && d <= UNIT.to; };
const uKey = (s,i) => s+"-"+i;
const uItem = key => { const [s,i] = key.split("-"); return UNIT.sections.find(x=>x.key===s).items[+i]; };
const uAnsAll = () => (uDoc && uDoc.answers) || {};
function uWords(it, key){ const w = it.en.split(/\s+/); let sh = seeded(w, key.length*31 + w.length*17 + 3); if(sh.join(" ")===w.join(" ")) sh = sh.slice(1).concat(sh[0]); return sh; }
const uTotal = () => UNIT.sections.reduce((n,s)=>n+s.items.length,0);

function unitLine(){
  if(!unitActive()) return "";
  return `\nTema da aula desta semana (Unit ${UNIT.n}: ${UNIT.title}): atitudes em relação a dinheiro e gastos (spend, save, afford, borrow, lend, owe, waste), filantropia e caridade (donate, raise money, volunteer, fundraiser), habilidades para ajudar os outros, comprar roupas e pedir reembolso (try on, size, fit, suit, receipt, refund, exchange) e anúncio de venda ("for sale", condition, o.n.o.). Use esse tema em pelo menos 4 dos 6 exercícios de hoje, sem repetir exatamente as frases da apostila.`;
}

async function uSave(key, a){
  uRetry.delete(key); delete uErr[key];
  const all = {...uAnsAll(), [key]: a};
  uDoc = {...(uDoc||{}), unit:UNIT.n, answers: all};
  render();
  if(!tcol) return;
  try{
    if(uDoc._saved) await tcol.doc(UNIT.id).update({answers:{[key]:a}, updated:Date.now()});
    else { await tcol.doc(UNIT.id).set({unit:UNIT.n, title:UNIT.title, answers:all, updated:Date.now()}); uDoc._saved = true; }
  }catch(e){ uErr[key] = "Couldn't save this answer."; render(); }
  if(!a.ok && col && a.text && a.better){
    const id = "x" + idFor(a.text);
    try{ await col.doc(id).set({src:a.text, out:a.better, from:"en", kind:"fix", pattern:a.pattern||"", meaningPt:a.pt||"",
      alts:[], pron:"", note:a.note||"", ex:"", exPt:"", ctx:"Class", fav:true, ts:Date.now()}); }catch(e){}
  }
}
function uPrompt(it, text){
  return `Corrija a resposta de um aluno brasileiro de inglês nível B1 que está em Malta (inglês britânico). Tema da aula: Unit ${UNIT.n} Money.
Tarefa: ${it.pt}${it.pattern?`\nMolde sugerido: ${it.pattern}`:""}
Resposta modelo: ${it.model}
Resposta do aluno: """${text}"""

${it.open ? "É uma pergunta de opinião para conversa: qualquer opinião vale. Avalie só se o inglês está gramatical e natural e se responde à pergunta." : "Considere correta qualquer frase gramatical e natural que cumpra a tarefa, mesmo diferente do modelo."} Pequenos erros de digitação não contam.
Responda só com JSON:
{"ok":true|false,"better":"a resposta dele corrigida e natural, mantendo as ideias dele (igual, se já estiver ótima)","note":"1 ou 2 frases em INGLÊS simples (nível B1): o erro principal ou um elogio específico. Sem travessões."}`;
}
async function uCheckWrite(key){
  const it = uItem(key), text = (uDrafts[key]||"").trim();
  if(!text || !sample || uChecking.has(key)) return;
  uChecking.add(key); delete uErr[key]; render();
  try{
    const r = await sample.json(uPrompt(it, text), {modelTier:"quick", cache:false});
    uChecking.delete(key);
    await uSave(key, {text, ok: r?.ok===true, better:String(r?.better||it.model), note:String(r?.note||""), pattern:it.pattern||"", pt:it.pt});
  }catch(e){
    uChecking.delete(key);
    uErr[key] = e?.code==="rate_limited" ? "Too many checks in a row. Wait a moment." : "Couldn't check it right now. Try again.";
    render();
  }
}

function uItemHTML(it, key){
  const a = uAnsAll()[key], done = a && !uRetry.has(key);
  let b = "", label = it.k==="mc" ? "Choose the right word" : it.k==="order" ? "Build the sentence" : (it.open ? "Answer the question" : "Write it in English");
  if(it.k==="mc"){
    b += `<div class="q2">${esc(it.q)}</div><div class="opts">${it.o.map((o,j)=>{
      let cls = "qopt"; if(done){ if(j===it.a) cls+=" right"; else if(j===a.pick) cls+=" wrong"; }
      return `<button class="${cls}" type="button" data-umc="${key}:${j}" ${done?"disabled":""}>${esc(o)}</button>`; }).join("")}</div>`;
    if(done) b += `<div><span class="fb ${a.ok?"ok":"no"}">${a.ok?"Correct":"Not quite"}</span></div><div class="note">${esc(it.why)}</div>
      <div class="actions"><button class="ghost" type="button" data-uredo="${key}">Try again</button></div>`;
  } else if(it.k==="order"){
    b += `<div class="note">${esc(it.pt)}</div>`;
    if(done){
      b += `<div><span class="fb ${a.ok?"ok":"no"}">${a.ok?"Correct":"Almost"}</span></div>${a.ok?"":`<div class="mine">You: <s>${esc(a.text)}</s></div>`}
        <div class="out">${esc(it.en)}${/^(could|do|have|can|what|where|how|is|are|did)\b/i.test(it.en)?"?":"."}</div>
        <div class="actions">${canSpeak?`<button class="ghost" type="button" data-usay="${esc(it.en)}">Listen</button>`:""}<button class="ghost" type="button" data-uredo="${key}">Try again</button></div>`;
    } else {
      const w = uWords(it,key), pk = uPicks[key]||[];
      b += `<div class="built">${pk.length ? pk.map((k,n)=>`<button class="word" type="button" data-uunpick="${key}:${n}">${esc(w[k])}</button>`).join("") : `<span class="hint">Tap the words in the right order</span>`}</div>
        <div class="bank">${w.map((x,k)=> pk.includes(k) ? "" : `<button class="word" type="button" data-upick="${key}:${k}">${esc(x)}</button>`).join("")}</div>
        <div class="actions"><button class="ghost" type="button" data-ureset="${key}">Clear</button><button class="go" type="button" data-uord="${key}" ${pk.length===w.length?"":"disabled"}>Check</button></div>`;
    }
  } else {
    b += `<div class="q2">${esc(it.pt)}</div>${it.pattern?`<div class="note"><span class="lang">Pattern</span><br><b>${esc(it.pattern)}</b></div>`:""}`;
    if(done){
      b += `<div><span class="fb ${a.ok?"ok":"no"}">${a.ok?"Good":"Almost"}</span></div>
        ${cleanW(a.text)!==cleanW(a.better)?`<div class="mine">You: ${a.ok?esc(a.text):`<s>${esc(a.text)}</s>`}</div>`:""}
        <div class="out">${esc(a.better)}</div>${a.note?`<div class="note">${esc(a.note)}</div>`:""}
        <div class="ex"><span class="lang">Model answer</span><br><b>${esc(it.model)}</b></div>
        <div class="actions">${canSpeak?`<button class="ghost" type="button" data-usay="${esc(a.better)}">Listen</button>`:""}<button class="ghost" type="button" data-uredo="${key}">Try again</button></div>`;
    } else {
      b += `<textarea data-udraft="${key}" placeholder="Write in English" aria-label="Your answer">${esc(uDrafts[key]||"")}</textarea>
        <div class="actions"><button class="ghost" type="button" data-utip="${key}">${uTip.has(key)?"Hide model":"See model"}</button><button class="go" type="button" data-uwrite="${key}" ${uChecking.has(key)||!sample?"disabled":""}>${uChecking.has(key)?"Checking...":"Check"}</button></div>
        ${uTip.has(key)?`<div class="ex"><b>${esc(it.model)}</b></div>`:""}`;
    }
  }
  if(uErr[key]) b += `<div class="status err">${esc(uErr[key])}</div>`;
  return `<li class="exr${done?" done":""}"><div class="lang">${label}</div>${b}</li>`;
}

async function bStart(){
  if(!bcol || bBusy || openB()) return;
  bBusy = true; bErr = ""; render();
  const seen = {}; bSess.forEach(s => (s.ids||[]).forEach(id => seen[id] = (seen[id]||0) + 1));
  const seed = Date.now() % 233280;
  let ids = [];
  TB_CATS.forEach((c,ci) => {
    const pool = seeded(TB.filter(x => x.c===c.k), seed + ci*7).sort((a,b) => (seen[a.id]||0) - (seen[b.id]||0));
    ids.push(...pool.slice(0, TB_PER).map(x => x.id));
  });
  ids = seeded(ids, seed + 1);
  try{ await bcol.doc("s-" + Date.now()).set({started:Date.now(), date:ymd(new Date()), status:"open", ids, answers:{}}); bFb = null; bInput = ""; bView = "q"; }
  catch(e){ bErr = e?.code==="quota_exceeded" ? "Storage is full." : "Couldn't start the check. Try again."; }
  finally{ bBusy = false; render(); }
}
function tbPrompt(it, given){
  return `Avalie a tradução de um aluno brasileiro de inglês (nível B1, morando em Malta, inglês britânico). O foco do exercício é o verbo to be e os auxiliares.
Frase em português: "${it.q}"
Resposta modelo: "${it.acc[0]}"
Resposta do aluno: """${given}"""
Considere correta qualquer frase gramatical e natural com o mesmo sentido, mesmo diferente do modelo. Pequenos erros de digitação não contam como erro.
Responda só com JSON:
{"ok":true|false,"better":"a frase dele corrigida e natural (igual, se já estiver ótima)","note":"1 ou 2 frases em PORTUGUÊS do Brasil explicando o erro principal e a regra por trás dele (ou elogiando algo específico, se estiver certo). Cite as palavras em inglês entre aspas. Sem travessões."}`;
}
async function bAnswer(given){
  const s = openB(); if(!s || bChecking) return;
  const i = Object.keys(s.answers||{}).length, it = tbItem(s.ids[i]); if(!it) return;
  let ok = false, extra = {};
  if(it.t==="mc" || it.t==="pick") ok = given === it.a;
  else {
    given = String(given).trim(); if(!given) return;
    const g = tbNorm(given); ok = it.acc.some(x => tbNorm(x) === g);
    if(!ok && it.t==="tr"){
      if(sample){
        bChecking = true; render();
        try{ const r = await sample.json(tbPrompt(it, given), {modelTier:"quick", cache:false});
          ok = r?.ok === true; if(r?.better) extra.better = String(r.better); if(r?.note) extra.note = String(r.note); }
        catch(e){ extra.note = "Não foi possível corrigir com o Claude agora, então a resposta foi comparada só com o modelo."; }
        finally{ bChecking = false; }
      }
    }
  }
  const a = {g: given, ok, ...extra};
  s.answers = {...(s.answers||{}), [i]: a}; bFb = i; bInput = ""; render();
  try{ await bcol.doc(s.id).update({answers: {[String(i)]: a}}); }catch(e){ bErr = "Couldn't save this answer."; render(); }
  if(!ok && it.t==="tr" && col){
    try{ await col.doc("x" + idFor(given)).set({src:given, out:extra.better || it.acc[0], from:"en", kind:"fix", pattern:"", meaningPt:it.q,
      alts:[], pron:"", note:extra.note || tbCat(it.c).rule, ex:"", exPt:"", ctx:"Practice", fav:true, ts:Date.now()}); }catch(e){}
  }
}
async function bFinish(){
  const s = openB(); if(!s) return;
  const sc = tbScore(s), cats = {};
  for(const k in sc.cats) cats[k] = Math.round(sc.cats[k].r / sc.cats[k].n * 100);
  try{ await bcol.doc(s.id).update({status:"done", finished:Date.now(), score:sc.pct, ok:sc.ok, total:sc.n, cats}); bViewId = s.id; bView = "res"; bFb = null; }
  catch(e){ bErr = "Couldn't save the result. Try again."; }
  render();
}
async function bDiscard(){
  const s = openB(); if(!s) return;
  bConfirm = false;
  try{ await bcol.doc(s.id).delete(); }catch(e){ bErr = "Couldn't discard it."; }
  bView = "home"; render();
}

    return `<div class="arow"><span>${esc(c.s)}${sub && v.n?` <span class="meta">${v.n}</span>`:""}</span><span class="track"><i class="${p<70?"low":""}" style="width:${p}%"></i></span><b>${p}%</b></div>`; }).join("")}</div>`;
}

function tbQuestion(p){
  const s = openB(); if(!s){ bView = "home"; return tbHome(p); }
  const ans = s.answers || {}, n = Object.keys(ans).length, total = s.ids.length;
  const i = bFb !== null ? bFb : n;
  if(i >= total){ p.innerHTML = `<div class="empty"><strong>All ${total} answered</strong><div style="margin-top:12px"><button class="go" type="button" data-bfinish="1" style="margin:0">See my result</button></div>${bErr?`<div class="status err">${esc(bErr)}</div>`:""}</div>`; return; }
  const it = tbItem(s.ids[i]), c = tbCat(it.c), a = bFb !== null ? ans[i] : null;
  let b = "";
  const lab = {mc:"Choose the right word", pick:"Which sentence is correct?", type:"Write the missing word", tr:"Say it in English"}[it.t];
  if(it.t==="mc" || it.t==="pick"){
    if(it.t==="mc") b += `<div class="q2">${esc(it.q)}</div>`;
    b += `<div class="opts">${it.o.map((o,j) => { let cls = "qopt"; if(a){ if(j===it.a) cls += " right"; else if(j===a.g) cls += " wrong"; }
      return `<button class="${cls}" type="button" data-bpick="${j}" ${a?"disabled":""}>${esc(o)}</button>`; }).join("")}</div>`;
  } else {
    b += `<div class="q2">${esc(it.q)}</div>`;
    if(!a) b += `<input class="search" id="tbIn" data-binput="1" type="text" autocomplete="off" autocapitalize="${it.t==="tr"?"sentences":"none"}" spellcheck="false" placeholder="${it.t==="tr"?"Write the sentence in English":"One or two words"}" value="${esc(bInput)}" aria-label="Your answer">
      <div class="actions"><button class="go" type="button" data-bcheck="1" style="margin-left:auto" ${bChecking?"disabled":""}>${bChecking?"Checking...":"Check"}</button></div>`;
  }
  if(a){
    b += `<div><span class="fb ${a.ok?"ok":"no"}">${a.ok?"Correct":"Not quite"}</span></div>`;
    if(it.t==="type" || it.t==="tr") b += `<div class="mine">You: ${a.ok?esc(a.g):`<s>${esc(a.g)}</s>`}</div>`;
    const right = a.better && it.t==="tr" ? a.better : tbRight(it);
    if(!(a.ok && (it.t==="mc"||it.t==="pick"))) b += `<div class="out">${esc(right)}</div>`;
    if(a.note) b += `<div class="note">${esc(a.note)}</div>`;
    b += `${tbMemo(it.c)}<div class="ex">${it.w?`<b>${esc(it.w)}</b><br>`:""}${esc(c.rule)}<br><span class="meta">${esc(c.pt)}</span></div>
      <div class="actions">${canSpeak?`<button class="ghost" type="button" data-bsay="${esc(right)}">Listen</button>`:""}
      <button class="go" type="button" data-bnext="1">${i+1>=total?"See my result":"Next"}</button></div>`;
  }
  const done = n;
  p.innerHTML = `<div style="display:flex;flex-direction:column;gap:10px">
    <div class="rhead"><button class="ghost" type="button" data-bgo="home">Pause</button><span class="meta">Question ${i+1} of ${total}</span></div>
    <div class="prog"><i style="width:${Math.round(done/total*100)}%"></i></div>
    <div class="exr${a?" done":""}"><div class="lang">${esc(c.s)} · ${lab}</div>${b}</div>
    ${bErr?`<div class="status err">${esc(bErr)}</div>`:""}</div>`;
}
function tbResult(p){
  const s = bSess.find(x => x.id === bViewId); if(!s || s.status!=="done"){ bView = "home"; return tbHome(p); }
  const done = doneB(), k = done.findIndex(x => x.id===s.id), prev = k>0 ? done[k-1] : null;
  const d = prev ? s.score - prev.score : null;
  const wrong = s.ids.map((id,i) => ({it:tbItem(id), a:(s.answers||{})[i]})).filter(x => x.it && x.a && !x.a.ok);
  p.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="rhead"><button class="ghost" type="button" data-bgo="home">← Mastery</button><span class="meta">${new Date(s.started).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}</span></div>
    <div class="lvl-top"><div class="lvl-badge">${s.score}%</div><div class="lvl-meta"><div class="lvl-score">${s.ok} of ${s.total} correct</div><div class="meta">${esc(tbSessName(s))}</div>
      <div class="meta">${tbLabel(s.score)}${d!==null?` · <span class="delta">${d>0?"+":""}${d} points vs last check</span>`:""}</div></div></div>
    <div class="section-title">This check by topic</div>${tbBars(s.cats||{}, false)}
    ${wrong.length?`<div class="section-title">Your mistakes (${wrong.length})</div><ul class="ex-list">${wrong.map(({it,a}) => `<li class="exr">
      <div class="lang">${esc(tbCat(it.c).s)}</div>
      ${it.t==="type"||it.t==="tr"?`<div class="mine">You: <s>${esc(a.g)}</s></div>`:it.t==="mc"?`<div class="mine">You: <s>${esc(fillBlank(it.q, it.o[a.g]))}</s></div>`:`<div class="mine">You: <s>${esc(it.o[a.g])}</s></div>`}
      <div class="out">${esc(a.better && it.t==="tr" ? a.better : tbRight(it))}</div>
      <div class="note">${esc(it.w || tbCat(it.c).rule)}</div>${tbMemo(it.c)}</li>`).join("")}</ul>`:`<div class="empty"><strong>No mistakes</strong>Every answer was right this time.</div>`}
    <div><button class="go" type="button" data-bgo="home" style="margin:0">Back to mastery</button></div></div>`;
}
function renderToBe(p){
  if(!bcol){ p.innerHTML = emptyHTML("Storage isn't available here", "Open the app in Claude, signed in to your account, to take the check."); return; }
  const f = document.activeElement?.id === "tbIn", pos = f ? document.activeElement.selectionStart : 0;
  if(bView === "q") tbQuestion(p); else if(bView === "res") tbResult(p); else if(bView === "mem") p.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">${memHTML()}</div>`; else if(bView === "rw") p.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">${rwHTML()}</div>`; else tbHome(p);
  if(f){ const n = $("#tbIn"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }
}
$("#panel").addEventListener("input", e => { if(e.target.dataset.binput) bInput = e.target.value; });
$("#panel").addEventListener("keydown", e => { if(e.target.id==="tbIn" && e.key==="Enter"){ e.preventDefault(); bAnswer(bInput); } });
$("#panel").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return; const ds = b.dataset;
  if(ds.bstart) bStart();
  else if(ds.bgo){ bView = ds.bgo; bErr = ""; bConfirm = false; render(); }
  else if(ds.bpick !== undefined) bAnswer(+ds.bpick);
  else if(ds.bcheck) bAnswer(bInput);
  else if(ds.bnext){ const s = openB(); bFb = null; bErr = ""; if(s && Object.keys(s.answers||{}).length >= s.ids.length) bFinish(); else { render(); setTimeout(() => $("#tbIn")?.focus(), 0); } }
  else if(ds.bfinish) bFinish();
  else if(ds.bres){ bViewId = ds.bres; bView = "res"; render(); }
  else if(ds.bdiscard){ if(!bConfirm){ bConfirm = true; render(); } else bDiscard(); }
  else if(ds.bsay) speak(ds.bsay);
});


/* ===== To be games: memory + right or wrong ===== */
const TB_PAIRS = {
  present:[["I am","Eu sou / eu estou"],["he / she / it is","Um só: ele, ela, isso é ou está"],["you / we / they are","Vocês, nós, eles são ou estão"]],
  neg:[["I'm not","Eu não sou / não estou"],["isn't","is + not: um só, negando"],["aren't","are + not: vários, negando"]],
  q:[["Are you...?","Pergunta: o be vem antes do sujeito"],["Yes, I am.","Resposta curta: repete o be, sem contração"],["..., aren't you?","\"Né?\": repete o auxiliar ao contrário"]],
  past:[["was","Passado de am e is (I, he, she, it)"],["were","Passado de are (you, we, they)"],["wasn't / weren't","Não era / não estava"]],
  there:[["there is","Tem UM (existe uma coisa)"],["there are","Tem VÁRIOS (existem coisas)"],["there was / were","Tinha / havia (no passado)"]],
  do:[["Are you tired?","Estado (ser ou estar) pede BE"],["Do you work?","Ação (verbo) pede DO"],["I agree","Concordar já é verbo: sem be"]],
  have:[["I'm hungry","Estou com fome (be, não have)"],["I'm 31","Tenho 31 anos (be, não have)"],["I have a cold","Estou resfriado"]],
  cont:[["I'm working","Estou trabalhando agora"],["I was sleeping","Eu estava dormindo"],["be + -ing","Duas peças: estou + -ando"]],
  fut:[["will be","Vai ser / vai estar (previsão)"],["I'm going to","Vou (plano já decidido)"],["Will you be...?","Você vai estar...?"]],
  perf:[["been","Particípio de be: vem depois de have"],["I've been to","Já estive em / já fui a"],["is spoken","Passiva: é falado (be + particípio)"],["should be","Depois de modal: be puro"]],
};
const RW_SKIP = {q2:"all", t1:[2], pa6:[0], e3:[0], t6:[0]};
let gMode = "weak", mem = null, memLock = false, rw = null, rwTimer = null;
const lsGet = k => { try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
function tbWeakCats(n){
  const m = tbMastery();
  if(!m.covered) return seeded(TB_CATS.map(c=>c.k), Date.now()%233280).slice(0,n);
  const sc = k => m.cats[k] ? m.cats[k].pct : 50;
  return TB_CATS.map(c=>c.k).sort((a,b) => sc(a) - sc(b)).slice(0,n);
}
const gCats = () => gMode==="weak" ? tbWeakCats(3) : TB_CATS.map(c=>c.k);

function memNew(){
  const seed = Date.now()%233280, cats = gCats();
  let pairs = [];
  if(gMode==="weak") cats.forEach((k,i) => seeded(TB_PAIRS[k], seed+i).slice(0,2).forEach(p => pairs.push({c:k, en:p[0], pt:p[1]})));
  else seeded(cats, seed).slice(0,6).forEach((k,i) => { const p = seeded(TB_PAIRS[k], seed+i)[0]; pairs.push({c:k, en:p[0], pt:p[1]}); });
  pairs = pairs.slice(0,6);
  const cards = seeded(pairs.flatMap((p,i) => [{pid:i, side:"en", text:p.en, c:p.c}, {pid:i, side:"pt", text:p.pt, c:p.c}]), seed+99);
  mem = {pairs, cards, open:[], matched:[], moves:0, start:Date.now(), msg:null, done:false, cats};
  memLock = false;
}
function memFlip(i){
  if(!mem || memLock || mem.done || mem.open.includes(i) || mem.matched.includes(mem.cards[i].pid)) return;
  mem.open.push(i);
  if(mem.open.length === 2){
    mem.moves++;
    const [a,b] = mem.open.map(k => mem.cards[k]);
    if(a.pid === b.pid){
      mem.matched.push(a.pid); mem.open = []; mem.msg = {ok:true, pid:a.pid};
      if(mem.matched.length === mem.pairs.length){
        mem.done = true; mem.secs = Math.round((Date.now()-mem.start)/1000);
        const best = lsGet("tb-mem-best");
        mem.record = !best || mem.moves < best.moves || (mem.moves===best.moves && mem.secs < best.secs);
        if(mem.record) lsSet("tb-mem-best", {moves:mem.moves, secs:mem.secs});
      }
    } else {
      mem.msg = {ok:false}; memLock = true;
      setTimeout(() => { if(mem){ mem.open = []; memLock = false; render(); } }, 1100);
    }
  } else mem.msg = null;
  render();
}
function memHTML(){
  if(!mem) memNew();
  const names = mem.cats.slice(0,3).map(k => tbCat(k).s).join(", ");
  let h = `<div class="rhead"><button class="ghost" type="button" data-bgo="home">← Mastery</button><span class="meta">${mem.matched.length} of ${mem.pairs.length} pairs · ${mem.moves} moves</span></div>
    <div><div class="lang">Memory game</div><div class="out">Match the English with when to use it</div><div class="meta">${gMode==="weak"?`Your weakest topics: ${esc(names)}`:"All topics"}</div></div>
    <div class="mgrid">${mem.cards.map((c,i) => { const m = mem.matched.includes(c.pid), up = m || mem.open.includes(i);
      return `<button type="button" class="mcard ${up?"up "+c.side:""}${m?" matched":""}" data-gflip="${i}" aria-label="${up?esc(c.text):"Hidden card"}" ${m?"disabled":""}>${up?esc(c.text):`<span class="mq">?</span>`}</button>`; }).join("")}</div>`;
  if(mem.msg?.ok){ const p = mem.pairs[mem.msg.pid];
    h += `<div class="focus"><b>${esc(p.en)} = ${esc(p.pt)}</b></div>${tbMemo(p.c)}`; }
  else if(mem.msg && !mem.msg.ok) h += `<div class="meta">Not a pair. Try to remember where each card is.</div>`;
  if(mem.done){ const best = lsGet("tb-mem-best");
    h += `<div class="empty"><strong>All pairs found</strong>${mem.moves} moves in ${mem.secs}s${mem.record?" · New record!":best?` · Your best: ${best.moves} moves`:""}. Perfect is ${mem.pairs.length} moves.
      <div style="margin-top:12px"><button class="go" type="button" data-gmem="new" style="margin:0">Play again</button></div></div>`; }
  else h += `<div class="actions"><button class="ghost" type="button" data-gmem="new">New cards</button></div>`;
  return h;
}

function rwPool(){
  const cats = gCats(), out = [];
  TB.filter(it => cats.includes(it.c) && RW_SKIP[it.id] !== "all").forEach(it => {
    const skip = Array.isArray(RW_SKIP[it.id]) ? RW_SKIP[it.id] : [];
    if(it.t==="mc") it.o.forEach((o,j) => { if(!skip.includes(j)) out.push({it, s:fillBlank(it.q, o), ok:j===it.a}); });
    else if(it.t==="pick") it.o.forEach((o,j) => { if(!skip.includes(j)) out.push({it, s:o, ok:j===it.a}); });
    else out.push({it, s:tbRight(it), ok:true});
  });
  const seed = Date.now()%233280;
  const right = seeded(out.filter(x=>x.ok), seed), wrong = seeded(out.filter(x=>!x.ok), seed+3);
  const n = Math.min(right.length, wrong.length, 20);
  return seeded(right.slice(0, n).concat(wrong.slice(0, n)), seed+7);
}
function rwNew(){
  rw = {pool:rwPool(), i:0, score:0, wrong:[], left:60, fb:null, done:false, streak:0, best:0, started:false};
}
function rwTick(){
  if(!rw || rw.done || !rw.started){ clearInterval(rwTimer); rwTimer = null; return; }
  if(tab!=="tobe" || bView!=="rw" || rw.fb) return;
  rw.left--;
  const t = $("#rwTime"); if(t) t.textContent = rw.left + "s";
  if(rw.left <= 0) rwEnd();
}
function rwStart(){ rw.started = true; clearInterval(rwTimer); rwTimer = setInterval(rwTick, 1000); render(); }
function rwEnd(){
  rw.done = true; clearInterval(rwTimer); rwTimer = null;
  const best = lsGet("tb-rw-best"); rw.prevBest = best;
  if(best===null || rw.score > best) lsSet("tb-rw-best", rw.score);
  render();
}
function rwAnswer(says){
  if(!rw || rw.done || rw.fb) return;
  const x = rw.pool[rw.i]; if(!x) return rwEnd();
  if(says === x.ok){ rw.score++; rw.streak++; rw.best = Math.max(rw.best, rw.streak); rw.flash = true; rwNext(); }

let spcol = null, spDocs = {}, spLesson = null, spBusy = new Set(), spMic = null, spMicKey = null, spMicMsg = "";

function spWords(e, key){ const w = e.en.split(/\s+/); let sh = seeded(w, key.length*29 + w.length*11 + 5); if(sh.join(" ")===w.join(" ")) sh = sh.slice(1).concat(sh[0]); return sh; }

async function spSave(L, i, a){
  a = {...a, ts: Date.now()};
  spRetry.delete(spKey(L.id,i)); delete spErr[spKey(L.id,i)];
  const d = spDocs[L.id] || {answers:{}};
  spDocs[L.id] = {...d, answers:{...(d.answers||{}), [i]:a}};
  render();
  if(!spcol) return;
  try{
    if(d._saved) await spcol.doc(L.id).update({answers:{[String(i)]:a}, updated:Date.now()});
    else await spcol.doc(L.id).set({lesson:L.id, answers:{...(d.answers||{}), [i]:a}, updated:Date.now()});
  }catch(e){ spErr[spKey(L.id,i)] = "Couldn't save this answer."; render(); }
  if(!a.ok && col && a.text && a.better){
    try{ await col.doc("x" + idFor(a.text)).set({src:a.text, out:a.better, from:"en", kind:"fix", pattern:L.ex[i].hint||"", meaningPt:"",
      alts:a.natural?[a.natural]:[], pron:"", note:a.note||"", ex:"", exPt:"", ctx:"Social", fav:true, ts:Date.now()}); }catch(e){}
  }
}
function spPrompt(L, e, text){
  const task = e.t==="expand" ? `Expandir a frase "${e.base}" acrescentando: ${e.blocks.join("; ")}. Ele deve dizer a frase longa completa.` : e.q;
  return `Você é o professor de speaking de um brasileiro (inglês B1, morando em Malta, inglês britânico). Ele entende bem ouvindo e lendo, mas trava para MONTAR frases quando fala. A resposta dele pode ter vindo de ditado por voz: ignore pontuação, maiúsculas e pequenas falhas de reconhecimento.
Lição: ${L.title}. Objetivo da lição: ${L.goal}
Tarefa: ${task}${e.hint?`\nEstrutura alvo: ${e.hint}`:""}
Resposta modelo (só referência): ${e.model}
Resposta dele: """${text}"""

Regras:
- "ok": true se a frase é compreensível, gramaticalmente correta (ou com um deslize mínimo) e cumpre a tarefa. Qualquer conteúdo ou opinião vale, não precisa ser igual ao modelo.
- "used_target": true se ele usou a estrutura alvo da lição.
- "better": a frase DELE corrigida, mantendo as ideias e o vocabulário dele (igual, se já estiver ótima).
- "natural": como um nativo britânico diria a mesma ideia de forma natural, um pouco mais rica (nível B1/B2).
- "note": 1 ou 2 frases em PORTUGUÊS do Brasil explicando o principal erro de montagem (ordem das palavras, sujeito faltando, auxiliar, tempo verbal, preposição) ou elogiando algo específico. Cite as palavras em inglês entre aspas. Sem travessões.
- "next": uma pergunta curta de continuação em inglês, como numa conversa real, para ele responder em voz alta.
Responda só com JSON:
{"ok":true,"used_target":true,"better":"...","natural":"...","note":"...","next":"..."}`;
}
async function spCheck(L, i){
  const key = spKey(L.id,i), e = L.ex[i], text = (spDrafts[key]||"").trim();
  if(!text || !sample || spBusy.has(key)) return;
  if(spMic){ try{ spMic.stop(); }catch(err){} }
  spBusy.add(key); delete spErr[key]; render();
  try{
    const r = await sample.json(spPrompt(L, e, text), {modelTier:"quick", cache:false});
    spBusy.delete(key);
    await spSave(L, i, {text, ok:r?.ok===true, target:r?.used_target===true, better:String(r?.better||e.model), natural:String(r?.natural||""), note:String(r?.note||""), next:String(r?.next||"")});
  }catch(err){
    spBusy.delete(key);
    spErr[key] = err?.code==="rate_limited" ? "Too many checks in a row. Wait a moment." : "Couldn't check it right now. Try again.";
    render();
  }
}
function spListen(key){
  if(!SR || !spMicOk) return;
  if(spMic){ try{ spMic.stop(); }catch(e){} return; }
  let r; try{ r = new SR(); }catch(e){ spMicOk = false; render(); return; }
  r.lang = "en-GB"; r.interimResults = true; r.continuous = false;
  const base = (spDrafts[key]||"").trim();
  r.onresult = ev => { let t = ""; for(const res of ev.results) t += res[0].transcript;
    spDrafts[key] = (base ? base + " " : "") + t;
    const ta = document.querySelector(`[data-spdraft="${key}"]`); if(ta) ta.value = spDrafts[key]; };
  r.onerror = ev => { if(["not-allowed","service-not-allowed","audio-capture"].includes(ev.error)){ spMicOk = false; spMicMsg = "The microphone isn't available here. Use the mic on your keyboard to dictate."; } };
  r.onend = () => { spMic = null; spMicKey = null; render(); };
  spMic = r; spMicKey = key;
  try{ r.start(); }catch(e){ spMic = null; spMicKey = null; spMicOk = false; }
  render();
}
